[package]
name = "sora-nexus-native-operation-recorder"
version = "0.1.0"
edition = "2021"
publish = false

[lints]
workspace = true

[dependencies]
framenode-runtime = { path = "../../runtime", default-features = false, features = ["std"] }
common = { path = "../../common" }
codec = { package = "parity-scale-codec", version = "=3.7.5", features = ["derive"] }
flate2 = "=1.1.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sp-core = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603-3" }
sp-io = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603-3" }
sp-runtime = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603-3" }
sp-version = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603-3" }
sc-executor = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2603-3" }
