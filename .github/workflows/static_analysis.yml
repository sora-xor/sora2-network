name: Cargo fmt & clippy

on:
  pull_request:
  push:
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: "1"

permissions:
  contents: read
  security-events: write

jobs:
  static_analysis:
    runs-on: ubuntu-22.04

    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check lint runner
        run: ./housekeeping/test-clippy.sh

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0

      - name: Clean unused cache
        run: |
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get update
          sudo apt-get install protobuf-compiler libclang-14-dev llvm-14-dev -y
      
      # v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          # 20GB of cache per repo per week
          cache-provider: "buildjet"

      - name: Export LLVM env
        id: llvm-env
        shell: bash
        run: |
          set -euo pipefail
          llvm_config_bin=""
          if command -v llvm-config-14 >/dev/null 2>&1; then
            llvm_config_bin="llvm-config-14"
          elif command -v llvm-config >/dev/null 2>&1; then
            llvm_config_bin="llvm-config"
          fi

          if [[ -n "${llvm_config_bin}" ]]; then
            llvm_libdir="$(${llvm_config_bin} --libdir)"
            echo "LIBCLANG_PATH=${llvm_libdir}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${llvm_libdir}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "DYLD_FALLBACK_LIBRARY_PATH=${llvm_libdir}:${DYLD_FALLBACK_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          elif [[ -d /usr/lib/llvm-14/lib ]]; then
            echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/lib/llvm-14/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi
      
      # v2.87.30
      - name: cargo install
        id: clippy-tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: clippy-sarif, sarif-fmt

      - name: cargo fmt
        run: cargo fmt --check

      # v7.1.0
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Check first-party lint policy
        run: python3 housekeeping/test_lint_policy.py

      - name: Enforce stable polkadot-sdk dependencies (no RC)
        run: |
          chmod +x .github/scripts/check_stable_deps_no_rc.sh
          .github/scripts/check_stable_deps_no_rc.sh

      - name: Clippy production mainnet
        if: ${{ !cancelled() && steps.clippy-tools.outcome == 'success' && steps.llvm-env.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./housekeeping/clippy.sh mainnet --message-format=json \
            | clippy-sarif | tee clippy-mainnet.sarif | sarif-fmt
        shell: bash

      - name: Clippy production try-runtime
        if: ${{ !cancelled() && steps.clippy-tools.outcome == 'success' && steps.llvm-env.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./housekeeping/clippy.sh try-runtime --message-format=json \
            | clippy-sarif | tee clippy-try-runtime.sarif | sarif-fmt
        shell: bash

      - name: Clippy extended features
        if: ${{ !cancelled() && steps.clippy-tools.outcome == 'success' && steps.llvm-env.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./housekeeping/clippy.sh extended --message-format=json \
            | clippy-sarif | tee clippy-extended.sarif | sarif-fmt
        shell: bash

      - name: Upload mainnet SARIF
        if: ${{ !cancelled() && hashFiles('clippy-mainnet.sarif') != '' }}
        # v4.39.1
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: clippy-mainnet.sarif
          category: clippy/mainnet

      - name: Upload try-runtime SARIF
        if: ${{ !cancelled() && hashFiles('clippy-try-runtime.sarif') != '' }}
        # v4.39.1
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: clippy-try-runtime.sarif
          category: clippy/try-runtime

      - name: Upload extended SARIF
        if: ${{ !cancelled() && hashFiles('clippy-extended.sarif') != '' }}
        # v4.39.1
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: clippy-extended.sarif
          category: clippy/extended
