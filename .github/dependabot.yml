version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/misc/farming_snapshot/convert"
      - "/misc/rewards_snapshot/get_lp_tokens"
      - "/vendor/sora2-common"
      - "/vendor/tikv-jemalloc-ctl-0.6.1"
      - "/misc/runtime_upgrade/vendor/native/py-bip39-bindings"
      - "/misc/runtime_upgrade/vendor/native/py-ed25519-zebra-bindings"
      - "/misc/runtime_upgrade/vendor/native/py-sr25519-bindings"
      - "/misc/runtime_upgrade/vendor/native/pydantic-core"
      - "/vendor/chopsticks-executor"
      - "/vendor/polkadot-wasm-crypto"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/misc/runtime_upgrade"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5

# Runtime and production-state rehearsal dependencies are updated deliberately
# with wire-format tests. Their operational graphs are audited in CI; automatic
# npm version bumps are not used for these compatibility-sensitive fixtures.
# Preserve the explicitly historical manifests, release artifacts and reproduction
# outputs; operational dependency updates require fresh validation evidence.
# Security updates target the repository's default branch independently of
# the develop version-update configuration above.
