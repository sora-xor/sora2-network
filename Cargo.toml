[profile.release]
panic = 'unwind'

# Offline recovery authenticates full trie snapshots at every restart. Keeping
# the portable SHA-256 compression loop optimized avoids minutes per checksum
# in debug rehearsals without removing or caching any verification step.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3

[profile.dev.package."sha2:0.11.1"]
opt-level = 3

# The offline recovery verifier decodes and checks the complete checkpoint on
# every run. Optimize its host-side iterators while retaining dev assertions and
# overflow checks; this does not change the runtime Wasm build profile.
[profile.dev.package.incident-recovery]
opt-level = 3

# Recovery crash/restart rehearsals re-read the complete compressed base trie.
# Keep that verification intact without running the gzip decoder unoptimized.
[profile.dev.package."miniz_oxide:0.9.1"]
opt-level = 3

# The snapshot restart profile also spends substantial time in the host gzip
# adapter and trie reconstruction. Keep the exact disk/hash/root checks while
# optimizing these dependency implementations in local verifier builds.
[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.sp-state-machine]
opt-level = 3

[profile.dev.package.sp-core]
opt-level = 3

