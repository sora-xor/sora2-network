    "database-sqlite",
    "std",
    "wasmtime",
]
std = [
    "futures-executor/thread-pool",
    "futures-util",
    "dep:pin-project",
    "schnorrkel/getrandom",
    "dep:soketto",
]
wasmtime = [
    "dep:wasmtime",
    "std",
]

[lib]
name = "smoldot"
path = "src/lib.rs"

[[bench]]
