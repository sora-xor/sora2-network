[package]
name = "polkadot-wasm-crypto-reviewed"
version = "7.5.4"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip39 = "2.2.2"
blake2b_simd = "1.0.4"
byteorder = "1.5.0"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
ecdsa = { version = "0.17.0", default-features = false, features = ["algorithm"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# Schnorrkel uses rand_core 0.6; enable its supported JavaScript entropy backend.
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
merlin = "3.0.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
schnorrkel = "0.11.5"
scrypt = { version = "0.12.0", default-features = false }
sha2 = { version = "0.11.1", features = ["zeroize"] }
sora-secp256k1-compat = { path = "adapter", default-features = false }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
twox-hash = { version = "2.1.2", default-features = false, features = ["xxhash64"] }
wasm-bindgen = "=0.2.129"

[dev-dependencies]
hex-literal = "1.1.0"
rand = "0.8.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"

[workspace]
members = ["adapter"]
default-members = ["."]
