[profile.release]
panic = "unwind"

[workspace]
members = [
    "pallets/*",
    "pallets/leaf-provider/runtime-api",
    "pallets/leaf-provider/rpc",
    "pallets/beefy-light-client/runtime-api",
    "pallets/beefy-light-client/rpc",
]

resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
bitvec = { version = "1" }
codec = { version = "3", package = "parity-scale-codec" }
derive-where = { version = "1.7.0", features = ["safe"] }
env_logger = "0.11.10"
ethbloom = { version = "0.13.0" }
ethereum-types = { version = "0.14.1" }
getrandom = { version = "0.2.1" }
hex = { package = "rustc-hex", version = "2.1.0" }
hex-literal = { version = "0.4.1" }
jsonrpsee = { version = "0.24.11" }
log = { version = "0.4.20" }
mmr-lib = { package = "ckb-merkle-mountain-range", version = "0.5.2" }
once_cell = { version = "1.5.2" }
parity-bytes = { version = "0.1.2" }
rand = "0.8.5"
rlp = { version = "0.5.2" }
scale-info = { version = "2" }
serde = { version = "1.0.130" }
serde_json = "1.0.73"
test-case = "3.1.0"
wasm-bindgen-test = "0.3.19"

ethabi = { git = "https://github.com/sora-xor/ethabi.git", branch = "sora-v1.6.0", package = "ethabi", default-features = false }
ethash = { git = "https://github.com/sora-xor/ethash.git", branch = "sora-v1.6.0", default-features = false }

currencies = { path = "../open-runtime-module-library-v1/currencies", package = "orml-currencies", default-features = false }
tokens = { path = "../open-runtime-module-library-v1/tokens", package = "orml-tokens", default-features = false }
traits = { path = "../open-runtime-module-library-v1/traits", package = "orml-traits", default-features = false }
orml-currencies = { version = "1.0.0", default-features = false }
orml-tokens = { version = "1.0.0", default-features = false }
orml-traits = { version = "1.0.0", default-features = false }

binary-merkle-tree = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2609", default-features = false }
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk.git", tag = "polkadot-stable2609", default-features = false }
