# Exact stable2609 package with a scoped voter poll-order fix; see SORA-PATCH.md.


["package"]
"name" = "sc-consensus-grandpa"
"version" = "0.45.0"
"authors" = ["Parity Technologies <admin@parity.io>"]
"edition" = "2021"
"license" = "GPL-3.0-or-later WITH Classpath-exception-2.0"
"homepage" = "https://paritytech.github.io/polkadot-sdk/"
"repository" = "https://github.com/paritytech/polkadot-sdk.git"
"description" = "Integration of the GRANDPA finality gadget into substrate."
"documentation" = "https://docs.rs/sc-consensus-grandpa"
"readme" = "README.md"

["package"."metadata"]

["package"."metadata"."docs"]

["package"."metadata"."docs"."rs"]
"targets" = ["x86_64-unknown-linux-gnu"]

["lints"]

["lints"."rust"]

["lints"."rust"."suspicious_double_ref_op"]
"level" = "allow"
"priority" = 2

["lints"."rust"."unexpected_cfgs"]
"level" = "warn"
"check-cfg" = ["cfg(build_opt_level, values(\"3\"))","cfg(build_profile, values(\"debug\", \"release\"))","cfg(enable_alloc_error_handler)","cfg(fuzzing)","cfg(ignore_flaky_test)","cfg(revive_debug)","cfg(substrate_runtime)"]

["lints"."clippy"]

["lints"."clippy"."all"]
"level" = "allow"
"priority" = 0

["lints"."clippy"."bind_instead_of_map"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."borrowed-box"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."complexity"]
"level" = "warn"
"priority" = 1

["lints"."clippy"."correctness"]
"level" = "warn"
"priority" = 1

["lints"."clippy"."default_constructed_unit_structs"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."derivable_impls"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."eq_op"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."erasing_op"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."extra-unused-type-parameters"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."identity-op"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."if-same-then-else"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."needless-lifetimes"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."needless_option_as_deref"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."nonminimal-bool"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."option-map-unit-fn"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."stable_sort_primitive"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."too-many-arguments"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."type_complexity"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."unit_arg"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."unnecessary_cast"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."useless_conversion"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."while_immutable_condition"]
"level" = "allow"
"priority" = 2

["lints"."clippy"."zero-prefixed-literal"]
"level" = "allow"
"priority" = 2

